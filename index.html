<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LTP Guitar Tuner V2</title><style> *{box-sizing:border-box}body{margin:0;background:#0e1724;color:#eef4ff;font:16px system-ui;text-align:center}main{max-width:560px;margin:auto;padding:24px 16px}h1{font-size:24px;margin:8px}small,p{color:#a8b6ca}svg{width:100%;max-width:380px}#note{font-size:80px;font-weight:bold;line-height:1.1}#status{font-size:24px;font-weight:bold;margin:12px}button,input{font:inherit;border:0;border-radius:12px;padding:14px;background:#233247;color:white}button{cursor:pointer}button.active{background:#2563eb}#start{width:100%;background:#2563eb;font-weight:bold;font-size:20px;margin:18px 0 4px}.strings{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:18px 0}input{width:85px}#msg{color:#ffce64;min-height:45px;overflow-wrap:anywhere}</style><main><h1>🎸 LTP CHROMATIC TUNER</h1><small>V2 • Mobile HTTPS Edition</small><svg viewBox="0 0 320 180"><path d="M30 155 A130 130 0 0 1 290 155" fill="none" stroke="#35465c" stroke-width="12" stroke-linecap="round"/><path d="M147 26 Q160 24 173 26" fill="none" stroke="#42d99b" stroke-width="12"/><g id="ticks"></g><g id="needle" transform="rotate(0 160 155)"><path d="M160 155 L160 40" stroke="#70a7ff" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="155" r="9" fill="#70a7ff"/></g></svg><div id="note">—</div><div id="reading">— Hz · — cents</div><div id="status">READY</div><div class="strings" id="strings"></div><label>A4 reference <input id="ref" type="number" min="400" max="480" value="440"> Hz</label><button id="start">🎙 START TUNER</button><p id="msg"></p><small>Play one string at a time • ±3 cents = in tune<br>Audio stays on your device • No AI or API key</small></main><script>
const $=id=>document.getElementById(id);let ctx,stream,analyser,raf,active=false,busy=false,target=null,history=[];const notes=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];const name=m=>notes[((m%12)+12)%12]+(Math.floor(m/12)-1);for(const m of [null,40,45,50,55,59,64]){let b=document.createElement('button');b.textContent=m===null?'AUTO':name(m);b.className=m===null?'active':'';b.onclick=()=>{target=m;history=[];document.querySelectorAll('.strings button').forEach(x=>x.classList.toggle('active',x===b))};$('strings').append(b)}for(let i=-5;i<=5;i++){let a=i*Math.PI/10,x=160+Math.sin(a)*119,y=155-Math.cos(a)*119,X=160+Math.sin(a)*108,Y=155-Math.cos(a)*108;let l=document.createElementNS('http://www.w3.org/2000/svg','line');for(let [k,v] of Object.entries({x1:x,y1:y,x2:X,y2:Y,stroke:'#a8b6ca','stroke-width':2}))l.setAttribute(k,v);$('ticks').append(l)}
function pitch(b,sr){let rms=Math.sqrt(b.reduce((s,x)=>s+x*x,0)/b.length);if(rms<.008)return null;let max=Math.min(Math.floor(sr/55),Math.floor(b.length/2)),min=Math.floor(sr/1500),d=new Float32Array(max+1),sum=0;d[0]=1;for(let t=1;t<=max;t++){let v=0;for(let j=0;j< b.length-max;j++){let z=b[j]-b[j+t];v+=z*z}sum+=v;d[t]=sum?v*t/sum:1}let t=min;while(t<max){if(d[t]<.15){while(t+1<=max&&d[t+1]<d[t])t++;let a=d[t-1],c=d[t+1],q=d[t],den=a+c-2*q;return sr/(t+(den?(a-c)/(2*den):0))}t++}return null}
let last=0,seen=0;function loop(ts){if(!active)return;raf=requestAnimationFrame(loop);if(ts-last<65)return;last=ts;let b=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(b);let f=pitch(b,ctx.sampleRate);if(!f){if(ts-seen>500){history=[];$('status').textContent='PLAY A STRING';$('status').style.color='';$('note').textContent='—';$('reading').textContent='— Hz · — cents';$('needle').setAttribute('transform','rotate(0 160 155)')}return}seen=ts;history.push(f);if(history.length>3)history.shift();f=[...history].sort((a,b)=>a-b)[Math.floor(history.length/2)];let ref=Number($('ref').value);if(ref<400||ref>480)ref=440;let midi=69+12*Math.log2(f/ref),m=target??Math.round(midi),c=(midi-m)*100;let good=Math.abs(c)<=3;$('note').textContent=name(m);$('reading').textContent=f.toFixed(1)+' Hz · '+(c>0?'+':'')+c.toFixed(1)+' cents';$('status').textContent=good?'IN TUNE':c<0?'FLAT — TIGHTEN':'SHARP — LOOSEN';$('status').style.color=good?'#42d99b':'#ffce64';$('needle').setAttribute('transform',`rotate(${Math.max(-90,Math.min(90,c*1.8))} 160 155)`)}
async function stop(){active=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')await ctx.close();$('start').textContent='🎙 START TUNER';$('status').textContent='READY';$('status').style.color='';$('note').textContent='—';$('reading').textContent='— Hz · — cents';$('needle').setAttribute('transform','rotate(0 160 155)');history=[]}
$('start').onclick=async()=>{if(busy)return;busy=true;try{if(active){await stop();return}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Open this tuner directly from an HTTPS website. Local content:// and ordinary HTTP cannot enable the microphone.');ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});analyser=ctx.createAnalyser();analyser.fftSize=4096;ctx.createMediaStreamSource(stream).connect(analyser);active=true;$('msg').textContent='';$('start').textContent='■ STOP TUNER';$('status').textContent='PLAY A STRING';raf=requestAnimationFrame(loop)}catch(e){await stop();$('msg').textContent=e.name==='NotAllowedError'?'Microphone denied. Allow microphone in Chrome site settings and Android app permissions; open the HTTPS page directly, not inside an iframe.':e.message}finally{busy=false}};if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)$('msg').textContent='HTTPS required for microphone. Do not open via content://.';window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop())});</script></html>
